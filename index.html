<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1419">
<title>ETH 交易快照</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <h1>ETH 交易快照</h1>
  <div class="bar">
    <input id="symbol" value="ETH" maxlength="10" autocapitalize="characters" autocorrect="off" spellcheck="false" inputmode="text" />
    <button id="btn-fetch" class="primary">抓取</button>
  </div>
  <div id="status">就绪 — 点"抓取"获取数据</div>
</header>

<details class="card" id="acc-card">
  <summary>账户参数 / CORS 代理(本机保存)</summary>
  <div class="grid">
    <label>净值 USDT
      <input id="equity" type="number" inputmode="decimal" step="0.01" placeholder="5000">
    </label>
    <label>单笔风险 %
      <input id="risk" type="number" inputmode="decimal" step="0.1" placeholder="1">
    </label>
    <label>持仓时长
      <select id="horizon">
        <option value="">—</option>
        <option value="intraday (&lt;8h)">日内 &lt;8h</option>
        <option value="swing (1-5 days)">摆动 1-5d</option>
        <option value="trend (&gt;1 week)">趋势 &gt;1 周</option>
      </select>
    </label>
    <label>爆仓容忍 %
      <input id="liqtol" type="number" inputmode="decimal" step="0.1" placeholder="8">
    </label>
    <label class="wide">已有头寸
      <textarea id="positions" rows="2" placeholder="例如 BTC 长 0.05 张"></textarea>
    </label>
    <label class="wide">CORS 代理 URL(Yahoo / Farside 需要,留空则两段失败)
      <input id="proxy" type="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://your-worker.workers.dev/?url=">
    </label>
    <label class="wide check">
      <input id="proxy-all" type="checkbox">
      <span>全部经代理(OKX/CoinGecko 也走 ↑ 的代理)</span>
    </label>
    <div class="hint wide">
      <b>什么时候打开 ↑</b>:你的网络出口被 OKX rubik 统计端点静默限制(返回空数据)时——典型表现为 §6 缺 OI 时序、§7/§8 完全空。CF Worker 边缘 IP 通常可直接拿到完整 rubik 数据。打开后每次抓取慢 5–10 秒(全部走代理),但数据完整。<br>
      OKX 行情/K线/盘口/clearing 与 CoinGecko 直连一般无障碍;Yahoo(DXY/NDX/US10Y)和 Farside(ETF)<b>始终需要</b>代理。
    </div>
  </div>
</details>

<div class="actions" id="actions" hidden>
  <button id="btn-copy" class="primary">📋 复制 Markdown</button>
  <button id="btn-json">下载 JSON</button>
</div>

<main id="output" class="preview" aria-live="polite"></main>

<footer>
  <small>纯前端 · 数据存于浏览器 · 不上传任何参数</small>
</footer>

<script src="snapshot.js"></script>
<script src="app.js"></script>
</body>
</html>
